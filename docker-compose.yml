services:
  backend:
    container_name: backend
    build: .
    env_file: .env
    command: uvicorn core.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - 8000:8000
    depends_on:
      - db
    networks:
      - mi-rutina-network

  db:
    image: postgres:15
    env_file: .env
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - mi-rutina-postgres_data:/var/lib/postgresql/data
    networks:
      - mi-rutina-network

volumes:
  mi-rutina-postgres_data:

networks:
  mi-rutina-network:
    driver: bridge
